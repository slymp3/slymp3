<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="15%" cy="90%" r="65%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="winClip">
      <rect x="150" y="100" width="600" height="330" rx="12"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#080808"/>
  <rect x="0" y="0" width="900" height="500" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="500" fill="url(#glow)"/>
  <rect x="0" y="0" width="900" height="500" fill="url(#glow2)"/>

  <g filter="url(#softShadow)">
    <rect x="150" y="100" width="600" height="330" rx="12" fill="#0d0d0f" stroke="#242424" stroke-width="1"/>
    <g clip-path="url(#winClip)">
      <rect x="150" y="100" width="600" height="38" fill="#111114"/>
    </g>
    <line x1="150" y1="138" x2="750" y2="138" stroke="#1f1f1f" stroke-width="1"/>

    <circle cx="180" cy="119" r="6" fill="#FF5F56"/>
    <circle cx="204" cy="119" r="6" fill="#FFBD2E"/>
    <circle cx="228" cy="119" r="6" fill="#27C93F"/>
    <text x="450" y="124" fill="#7a7a7a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle">slymp3@github ~ /profile</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
      <text x="180" y="170" fill="#39FF14">&gt; slymp3 --version</text>
      <text x="180" y="196" fill="#9a9a9a">v2.0.25 (github-profile)</text>

      <text x="180" y="236" fill="#39FF14">&gt; slymp3 auth --github</text>
      <text x="180" y="262" fill="#9a9a9a">Initializing secure connection...</text>
      <text x="180" y="288" fill="#39FF14">Connection established.</text>

      <text x="180" y="328" fill="#e6e6e6">Access granted. Welcome back, Jake.</text>
      <text x="180" y="354" fill="#9a9a9a">user:slymp3 &#183; role: ml_engineer / full-stack / ai_agents</text>

      <text x="180" y="394" fill="#39FF14">&gt;</text>
      <rect x="196" y="381" width="9" height="16" fill="#39FF14">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
