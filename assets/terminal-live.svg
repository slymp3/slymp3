<svg viewBox="0 0 900 628" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="15%" cy="90%" r="65%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="winClip">
      <rect x="150" y="100" width="600" height="468" rx="12"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip0"><rect x="210" y="152" width="0" height="22"><animate attributeName="width" begin="clock.begin+0.30s" dur="0.30s" from="0" to="54.0" fill="freeze"/></rect></clipPath>
    <clipPath id="clip1"><rect x="210" y="212" width="0" height="22"><animate attributeName="width" begin="clock.begin+2.05s" dur="0.60s" from="0" to="108.0" fill="freeze"/></rect></clipPath>
    <clipPath id="clip2"><rect x="210" y="272" width="0" height="22"><animate attributeName="width" begin="clock.begin+4.10s" dur="0.50s" from="0" to="90.0" fill="freeze"/></rect></clipPath>
    <clipPath id="clip3"><rect x="210" y="332" width="0" height="22"><animate attributeName="width" begin="clock.begin+6.05s" dur="0.65s" from="0" to="117.0" fill="freeze"/></rect></clipPath>
    <clipPath id="clip4"><rect x="210" y="392" width="0" height="22"><animate attributeName="width" begin="clock.begin+8.15s" dur="1.15s" from="0" to="207.0" fill="freeze"/></rect></clipPath>
    <clipPath id="clip5"><rect x="210" y="452" width="0" height="22"><animate attributeName="width" begin="clock.begin+10.75s" dur="0.85s" from="0" to="153.0" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="628" fill="#080808"/>
  <rect x="0" y="0" width="900" height="628" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="628" fill="url(#glow)"/>
  <rect x="0" y="0" width="900" height="628" fill="url(#glow2)"/>

  <!-- master clock: drives the whole loop -->
  <rect x="0" y="0" width="1" height="1" opacity="0">
    <animate id="clock" attributeName="width" from="1" to="1" dur="15.05s" repeatCount="indefinite"/>
  </rect>

  <g filter="url(#softShadow)">
    <rect x="150" y="100" width="600" height="468" rx="12" fill="#0d0d0f" stroke="#242424" stroke-width="1"/>
    <g clip-path="url(#winClip)">
      <rect x="150" y="100" width="600" height="38" fill="#111114"/>
    </g>
    <line x1="150" y1="138" x2="750" y2="138" stroke="#1f1f1f" stroke-width="1"/>

    <circle cx="180" cy="119" r="6" fill="#FF5F56"/>
    <circle cx="204" cy="119" r="6" fill="#FFBD2E"/>
    <circle cx="228" cy="119" r="6" fill="#27C93F"/>
    <text x="450" y="124" fill="#7a7a7a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle">slymp3@github ~ /profile</text>

    <g>
      <text x="180" y="168" fill="#39FF14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">&gt;</text><text x="210" y="168" fill="#e6e6e6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" clip-path="url(#clip0)">whoami</text>
      <text x="180" y="198" fill="#9a9a9a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" opacity="0">jake (slymp3)<animate attributeName="opacity" begin="clock.begin+0.75s" dur="0.15s" from="0" to="1" fill="freeze"/></text>
      <text x="180" y="228" fill="#39FF14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">&gt;</text><text x="210" y="228" fill="#e6e6e6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" clip-path="url(#clip1)">cat role.txt</text>
      <text x="180" y="258" fill="#9a9a9a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" opacity="0">ML Engineer / Full-Stack / AI Agent Dev<animate attributeName="opacity" begin="clock.begin+2.80s" dur="0.15s" from="0" to="1" fill="freeze"/></text>
      <text x="180" y="288" fill="#39FF14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">&gt;</text><text x="210" y="288" fill="#e6e6e6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" clip-path="url(#clip2)">ls skills/</text>
      <text x="180" y="318" fill="#9a9a9a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" opacity="0">ai_ml   languages   dev_stack   tooling<animate attributeName="opacity" begin="clock.begin+4.75s" dur="0.15s" from="0" to="1" fill="freeze"/></text>
      <text x="180" y="348" fill="#39FF14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">&gt;</text><text x="210" y="348" fill="#e6e6e6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" clip-path="url(#clip3)">cat stack.txt</text>
      <text x="180" y="378" fill="#9a9a9a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" opacity="0">Python · TypeScript · JavaScript · CSS<animate attributeName="opacity" begin="clock.begin+6.85s" dur="0.15s" from="0" to="1" fill="freeze"/></text>
      <text x="180" y="408" fill="#39FF14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">&gt;</text><text x="210" y="408" fill="#e6e6e6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" clip-path="url(#clip4)">ps aux | grep currently</text>
      <text x="180" y="438" fill="#9a9a9a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" opacity="0">building AI agents · shipping full-stack products<animate attributeName="opacity" begin="clock.begin+9.45s" dur="0.15s" from="0" to="1" fill="freeze"/></text>
      <text x="180" y="468" fill="#39FF14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">&gt;</text><text x="210" y="468" fill="#e6e6e6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" clip-path="url(#clip5)">cat manifesto.txt</text>
      <text x="180" y="498" fill="#9a9a9a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" opacity="0">Code is speech. Open-source the world.<animate attributeName="opacity" begin="clock.begin+11.75s" dur="0.15s" from="0" to="1" fill="freeze"/></text>
      <g opacity="0"><animate attributeName="opacity" begin="clock.begin+13.05s" dur="0.15s" from="0" to="1" fill="freeze"/><text x="180" y="528" fill="#39FF14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">&gt;</text><rect x="198" y="515" width="9" height="16" fill="#39FF14"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/></rect></g>
    </g>
  </g>
</svg>
